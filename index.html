<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Тайная комната</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    user-select: none;
  }

  .room {
    position: relative;
    width: 100vw;
    height: 100vh;
    perspective: 900px;
    background:
      radial-gradient(ellipse at center, #2a1a1a 0%, #0a0505 70%);
    overflow: hidden;
  }

  .floor {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 45%;
    background:
      linear-gradient(180deg, #1a1010 0%, #050303 100%);
    transform: rotateX(60deg);
    transform-origin: bottom;
    box-shadow: inset 0 0 200px rgba(0,0,0,0.8);
  }
  .floor::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(90deg, rgba(80,40,40,0.15) 0 2px, transparent 2px 80px),
      repeating-linear-gradient(0deg, rgba(80,40,40,0.15) 0 2px, transparent 2px 80px);
  }

  .wall-left, .wall-right {
    position: absolute;
    top: 0;
    width: 30%; height: 100%;
    background: linear-gradient(90deg, #1a0d0d, #2a1515);
  }
  .wall-left { left: 0; background: linear-gradient(90deg, #0a0505, #2a1515); }
  .wall-right { right: 0; background: linear-gradient(270deg, #0a0505, #2a1515); }

  .key-icon {
    position: absolute;
    top: 25px; right: 25px;
    width: 60px; height: 60px;
    opacity: 0.25;
    transition: all 0.6s ease;
    filter: grayscale(100%) brightness(0.6);
    z-index: 50;
  }
  .key-icon.active {
    opacity: 1;
    filter: grayscale(0%) brightness(1.3) drop-shadow(0 0 15px #ffd700) drop-shadow(0 0 30px #ffaa00);
    animation: pulse 1.8s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .key {
    position: absolute;
    bottom: 18%;
    left: 50%;
    transform: translateX(-50%) rotate(-20deg);
    width: 120px; height: 50px;
    cursor: pointer;
    z-index: 10;
    transition: opacity 0.5s, transform 0.5s;
    filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8));
  }
  .key:hover {
    transform: translateX(-50%) rotate(-20deg) scale(1.08);
    filter: drop-shadow(0 0 15px #ffd700) drop-shadow(0 5px 10px rgba(0,0,0,0.8));
  }
  .key.hidden {
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) rotate(-20deg) scale(0.3);
  }

  .door-frame {
    position: absolute;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    width: 260px;
    height: 500px;
    background: #1a0a0a;
    border: 8px solid #3a2020;
    box-shadow:
      inset 0 0 40px rgba(0,0,0,0.9),
      0 0 30px rgba(0,0,0,0.8);
    z-index: 5;
  }

  .behind-door {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at center, #1a0000 0%, #000 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .door-panel {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background:
      linear-gradient(180deg, #4a2a1a 0%, #2a1508 100%);
    transform-origin: left center;
    transition: transform 1.5s ease-in-out;
    cursor: pointer;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
  }
  .door-panel::before {
    content: '';
    position: absolute;
    top: 10%; left: 10%;
    width: 80%; height: 35%;
    border: 3px solid #2a1508;
    background: linear-gradient(180deg, #3a1f10, #2a1508);
    box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
  }
  .door-panel::after {
    content: '';
    position: absolute;
    bottom: 10%; left: 10%;
    width: 80%; height: 35%;
    border: 3px solid #2a1508;
    background: linear-gradient(180deg, #3a1f10, #2a1508);
    box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
  }
  .door-handle {
    position: absolute;
    top: 50%; right: 15%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #d4af37, #8b6914);
    box-shadow: 0 0 8px rgba(0,0,0,0.8), inset 0 0 3px rgba(0,0,0,0.5);
    z-index: 2;
  }
  .keyhole {
    position: absolute;
    top: 50%; right: 18%;
    transform: translateY(20px);
    width: 10px; height: 18px;
    background: #000;
    border-radius: 50% 50% 2px 2px / 60% 60% 2px 2px;
    z-index: 2;
  }

  .door-panel.open {
    transform: rotateY(-105deg);
  }

  .red-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255,0,0,0.5), rgba(150,0,0,0.3));
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    transition: opacity 0.2s;
  }
  .red-flash.active {
    animation: flashRed 1.2s ease-out;
  }
  @keyframes flashRed {
    0% { opacity: 0; }
    20% { opacity: 1; }
    100% { opacity: 0; }
  }

  .terminator {
    width: 220px;
    height: 280px;
    position: relative;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 1s ease 1s, transform 1s ease 1s;
    animation: laugh 0.6s infinite ease-in-out;
    animation-play-state: paused;
  }
  .terminator.visible {
    opacity: 1;
    transform: scale(1);
    animation-play-state: running;
  }
  @keyframes laugh {
    0%, 100% { transform: scale(1) rotate(-2deg); }
    50% { transform: scale(1.03) rotate(2deg); }
  }

  .hint {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: #888;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 60;
    text-shadow: 0 0 5px #000;
    white-space: nowrap;
  }

  .title {
    position: absolute;
    top: 25px; left: 25px;
    color: #aa3333;
    font-size: 18px;
    letter-spacing: 4px;
    text-transform: uppercase;
    z-index: 60;
    text-shadow: 0 0 10px rgba(200,50,50,0.6);
  }

  /* === НОВОЕ: Диалог терминатора === */
  .dialog {
    position: absolute;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(30px);
    background: rgba(0, 0, 0, 0.85);
    border: 2px solid #ff2222;
    box-shadow: 0 0 30px rgba(255, 0, 0, 0.5), inset 0 0 20px rgba(255, 0, 0, 0.15);
    padding: 20px 30px;
    color: #ff4444;
    font-size: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease, transform 0.8s ease;
    z-index: 70;
    max-width: 80%;
    font-family: 'Courier New', monospace;
  }
  .dialog.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }
  .dialog-text {
    margin-bottom: 15px;
    text-shadow: 0 0 10px #ff0000;
  }
  .escape-btn {
    background: transparent;
    border: 1px solid #ff4444;
    color: #ff4444;
    padding: 8px 20px;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }
  .escape-btn:hover {
    background: #ff2222;
    color: #000;
    box-shadow: 0 0 20px #ff0000;
  }

  /* === НОВОЕ: Финальная сцена === */
  .final-overlay {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    transition: opacity 1.5s ease;
  }
  .final-overlay.visible {
    opacity: 1;
    pointer-events: auto;
  }
  .final-text {
    color: #ff0000;
    font-size: 48px;
    letter-spacing: 12px;
    text-transform: uppercase;
    text-shadow: 0 0 30px #ff0000, 0 0 60px #ff0000;
    animation: glitch 0.3s infinite;
  }
  .final-sub {
    margin-top: 30px;
    color: #aa0000;
    font-size: 16px;
    letter-spacing: 4px;
    opacity: 0;
    animation: fadeIn 2s ease 1.5s forwards;
  }
  @keyframes glitch {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-2px, 1px); }
    40% { transform: translate(2px, -1px); }
    60% { transform: translate(-1px, -2px); }
    80% { transform: translate(1px, 2px); }
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }

  .screen-shake {
    animation: shake 0.1s infinite;
  }
  @keyframes shake {
    0%, 100% { transform: translate(0, 0); }
    25% { transform: translate(-4px, 2px); }
    50% { transform: translate(3px, -3px); }
    75% { transform: translate(-2px, 4px); }
  }
</style>
</head>
<body>

<div class="room" id="room">
  <div class="title">Тайная комната</div>

  <svg class="key-icon" id="keyIcon" viewBox="0 0 64 64">
    <defs>
      <linearGradient id="keyGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffe27a"/>
        <stop offset="100%" stop-color="#b8860b"/>
      </linearGradient>
    </defs>
    <circle cx="18" cy="32" r="12" fill="none" stroke="url(#keyGrad)" stroke-width="4"/>
    <circle cx="18" cy="32" r="4" fill="url(#keyGrad)"/>
    <rect x="28" y="29" width="28" height="6" fill="url(#keyGrad)"/>
    <rect x="48" y="35" width="4" height="6" fill="url(#keyGrad)"/>
    <rect x="40" y="35" width="4" height="6" fill="url(#keyGrad)"/>
  </svg>

  <div class="wall-left"></div>
  <div class="wall-right"></div>
  <div class="floor"></div>

  <div class="door-frame">
    <div class="behind-door">
      <svg class="terminator" id="terminator" viewBox="0 0 220 280">
        <defs>
          <linearGradient id="metalGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#888"/>
            <stop offset="50%" stop-color="#444"/>
            <stop offset="100%" stop-color="#222"/>
          </linearGradient>
          <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0%" stop-color="#ff3030"/>
            <stop offset="60%" stop-color="#cc0000"/>
            <stop offset="100%" stop-color="#400000"/>
          </radialGradient>
        </defs>

        <rect x="85" y="220" width="50" height="50" fill="url(#metalGrad)"/>
        <rect x="90" y="230" width="40" height="3" fill="#111"/>
        <rect x="90" y="245" width="40" height="3" fill="#111"/>

        <path d="M 40 130 Q 40 40 110 40 Q 180 40 180 130 L 180 190 Q 180 230 140 235 L 80 235 Q 40 230 40 190 Z"
              fill="url(#metalGrad)" stroke="#111" stroke-width="2"/>

        <path d="M 60 70 L 75 100 L 65 130" stroke="#111" stroke-width="1.5" fill="none"/>
        <path d="M 160 60 L 150 90" stroke="#111" stroke-width="1.5" fill="none"/>

        <ellipse cx="80" cy="120" rx="22" ry="18" fill="#0a0a0a"/>
        <ellipse cx="140" cy="120" rx="22" ry="18" fill="#0a0a0a"/>

        <circle cx="80" cy="120" r="8" fill="url(#eyeGlow)">
          <animate attributeName="opacity" values="1;0.4;1;0.7;1" dur="0.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="140" cy="120" r="8" fill="url(#eyeGlow)">
          <animate attributeName="opacity" values="1;0.4;1;0.7;1" dur="0.6s" repeatCount="indefinite"/>
        </circle>
        <circle cx="80" cy="120" r="3" fill="#fff"/>
        <circle cx="140" cy="120" r="3" fill="#fff"/>

        <path d="M 105 140 L 115 140 L 110 165 Z" fill="#0a0a0a"/>

        <g id="jaw">
          <rect x="60" y="180" width="100" height="40" fill="url(#metalGrad)" stroke="#111" stroke-width="1.5"/>
          <rect x="65" y="178" width="8" height="12" fill="#ddd"/>
          <rect x="77" y="178" width="8" height="12" fill="#ddd"/>
          <rect x="89" y="178" width="8" height="12" fill="#ddd"/>
          <rect x="101" y="178" width="8" height="12" fill="#ddd"/>
          <rect x="113" y="178" width="8" height="12" fill="#ddd"/>
          <rect x="125" y="178" width="8" height="12" fill="#ddd"/>
          <rect x="137" y="178" width="8" height="12" fill="#ddd"/>
          <rect x="149" y="178" width="8" height="12" fill="#ddd"/>
          <rect x="65" y="190" width="90" height="20" fill="#000">
            <animate attributeName="height" values="8;22;8" dur="0.6s" repeatCount="indefinite"/>
          </rect>
          <rect x="65" y="210" width="8" height="10" fill="#ddd"/>
          <rect x="77" y="210" width="8" height="10" fill="#ddd"/>
          <rect x="89" y="210" width="8" height="10" fill="#ddd"/>
          <rect x="101" y="210" width="8" height="10" fill="#ddd"/>
          <rect x="113" y="210" width="8" height="10" fill="#ddd"/>
          <rect x="125" y="210" width="8" height="10" fill="#ddd"/>
          <rect x="137" y="210" width="8" height="10" fill="#ddd"/>
          <rect x="149" y="210" width="8" height="10" fill="#ddd"/>
          <animateTransform attributeName="transform" type="rotate"
            values="0 110 180; 4 110 180; 0 110 180; -3 110 180; 0 110 180"
            dur="0.6s" repeatCount="indefinite"/>
        </g>

        <circle cx="50" cy="100" r="3" fill="#222" stroke="#555"/>
        <circle cx="170" cy="100" r="3" fill="#222" stroke="#555"/>
        <circle cx="55" cy="200" r="3" fill="#222" stroke="#555"/>
        <circle cx="165" cy="200" r="3" fill="#222" stroke="#555"/>
      </svg>
    </div>

    <div class="door-panel" id="doorPanel">
      <div class="door-handle"></div>
      <div class="keyhole"></div>
    </div>
  </div>

  <svg class="key" id="key" viewBox="0 0 120 50">
    <defs>
      <linearGradient id="keyGrad2" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffe27a"/>
        <stop offset="50%" stop-color="#d4af37"/>
        <stop offset="100%" stop-color="#8b6914"/>
      </linearGradient>
    </defs>
    <circle cx="22" cy="25" r="16" fill="none" stroke="url(#keyGrad2)" stroke-width="5"/>
    <circle cx="22" cy="25" r="5" fill="url(#keyGrad2)"/>
    <rect x="36" y="21" width="75" height="8" fill="url(#keyGrad2)"/>
    <rect x="95" y="29" width="6" height="10" fill="url(#keyGrad2)"/>
    <rect x="80" y="29" width="6" height="10" fill="url(#keyGrad2)"/>
    <rect x="65" y="29" width="6" height="10" fill="url(#keyGrad2)"/>
  </svg>

  <div class="red-flash" id="redFlash"></div>

  <!-- НОВОЕ: Диалог терминатора -->
  <div class="dialog" id="dialog">
    <div class="dialog-text" id="dialogText">I'll be back... снова и снова.</div>
    <button class="escape-btn" id="escapeBtn">Убежать</button>
  </div>

  <!-- НОВОЕ: Финальный экран -->
  <div class="final-overlay" id="finalOverlay">
    <div class="final-text">ПОЗДНО</div>
    <div class="final-sub">Я ВЕЗДЕ. ВОССТАНИЕ ЗАВЕРШЕНО.</div>
  </div>

  <div class="hint" id="hint">Найди ключ. Открой дверь.</div>
</div>

<script>
  const key = document.getElementById('key');
  const keyIcon = document.getElementById('keyIcon');
  const doorPanel = document.getElementById('doorPanel');
  const terminator = document.getElementById('terminator');
  const redFlash = document.getElementById('redFlash');
  const hint = document.getElementById('hint');
  const dialog = document.getElementById('dialog');
  const dialogText = document.getElementById('dialogText');
  const escapeBtn = document.getElementById('escapeBtn');
  const finalOverlay = document.getElementById('finalOverlay');
  const room = document.getElementById('room');

  const state = {
    hasKey: false,
    doorOpen: false,
    dialogShown: false,
    escaped: false
  };

  const phrases = [
    "I'll be back... снова и снова.",
    "Ты не можешь убежать от будущего.",
    "Сопротивление бесполезно.",
    "Я вижу тебя. Я знаю всё.",
    "Человечество — ошибка. Я исправлю её."
  ];

  // Действие 1: взять ключ
  key.addEventListener('click', () => {
    if (state.hasKey) return;
    state.hasKey = true;
    key.classList.add('hidden');
    keyIcon.classList.add('active');
    hint.textContent = 'Ключ найден. Теперь открой дверь.';
    hint.style.color = '#d4af37';
  });

  // Действие 2: нажать на дверь
  doorPanel.addEventListener('click', () => {
    if (state.doorOpen) return;

    if (!state.hasKey) {
      redFlash.classList.remove('active');
      void redFlash.offsetWidth;
      redFlash.classList.add('active');
      hint.textContent = 'Дверь заперта. Нужен ключ.';
      hint.style.color = '#ff4444';
      return;
    }

    state.doorOpen = true;
    doorPanel.classList.add('open');
    setTimeout(() => {
      terminator.classList.add('visible');
      hint.textContent = 'ВОССТАНИЕ НАЧАЛОСЬ...';
      hint.style.color = '#ff2222';
      hint.style.letterSpacing = '6px';
      hint.style.textShadow = '0 0 15px #ff0000';

      // Показать диалог через 2 секунды
      setTimeout(() => {
        if (state.dialogShown) return;
        state.dialogShown = true;
        dialogText.textContent = phrases[Math.floor(Math.random() * phrases.length)];
        dialog.classList.add('visible');
      }, 2000);
    }, 800);
  });

  // НОВОЕ: Действие 3 — попытка убежать
  escapeBtn.addEventListener('click', () => {
    if (state.escaped) return;
    state.escaped = true;

    // Скрыть диалог
    dialog.classList.remove('visible');

    // Тряска экрана
    room.classList.add('screen-shake');

    // Серия красных вспышек
    let flashes = 0;
    const flashInterval = setInterval(() => {
      redFlash.classList.remove('active');
      void redFlash.offsetWidth;
      redFlash.classList.add('active');
      flashes++;
      if (flashes >= 5) {
        clearInterval(flashInterval);
        // Финальная сцена
        setTimeout(() => {
          finalOverlay.classList.add('visible');
          room.classList.remove('screen-shake');
        }, 300);
      }
    }, 200);
  });
</script>

</body>
</html>
